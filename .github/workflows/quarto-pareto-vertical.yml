name: "Pareto — Quarto réel, Git épinglé, HTTP et contexte Firefox"

on:
  pull_request:
    paths:
      - "quarto_pareto_demo.py"
      - "tests/test_quarto_pareto_demo.py"
      - "extension/historique_ressource.js"
      - "tests/test_historique_ressource.js"
      - ".github/workflows/quarto-pareto-vertical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vertical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render two real, synthetic Quarto Git revisions and serve verified HTML
        env:
          ALLIAGE_TEST_REAL_QUARTO: "1"
        run: |
          quarto --version
          python3 -m unittest discover -s tests -p 'test_quarto_pareto_demo.py' -v
      - name: Exercise Firefox overlay as DOM simulation only
        run: |
          node --check extension/historique_ressource.js
          node --test tests/test_historique_ressource.js
      - name: Verify the proposed FIXED public Quarto fixture at two pinned SHAs
        env:
          ALLIAGE_PINNED_DEMO_V5: "5b477ca0436cff5a4e5a3ec9b3b0bfbb8a514347"
          ALLIAGE_PINNED_DEMO_V6: "8e2f8b84515e9555c853c42f14cde0bca2c5de53"
        run: |
          # PR #24 is a PROPOSED maintenance fix, NOT the deployed demo branch.
          git clone -q --single-branch --branch fix/pareto-demo-quarto-gitignore \
            https://github.com/djibian/alliage.git "$RUNNER_TEMP/alliage-public-demo-candidate"
          python3 - <<'PY'
          import http.client
          import os
          import threading
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          from urllib.parse import urlsplit
          from quarto_pareto_demo import prepare
          from quarto_versions import _git

          repo = Path(os.environ["RUNNER_TEMP"]) / "alliage-public-demo-candidate"
          initial = os.environ["ALLIAGE_PINNED_DEMO_V5"]
          observed = os.environ["ALLIAGE_PINNED_DEMO_V6"]
          tracking = "refs/remotes/origin/experiment/pareto-quarto-demo"
          for commit in (initial, observed):
              assert _git(repo, "cat-file", "-t", commit).strip() == b"commit"
          # CI-only local tracking ref; never touch GitHub's remote fixture branch.
          _git(repo, "update-ref", tracking, observed)
          with TemporaryDirectory(prefix="alliage-public-fixture-") as home:
              with patch("quarto_observed_session.Path.home", return_value=Path(home)):
                  try:
                      result, preview, server = prepare(
                          repo, "djibian/alliage", tracking, initial,
                          public_fictional_trusted=True)
                  except Exception:
                      # Diagnostic ONLY on this public/fictional maintenance PR.
                      # Compare tracked .gitignore, with no sensitive data.
                      import subprocess
                      check = Path(home) / "debug-project"
                      check.mkdir()
                      for name in (".gitignore", "AGENTS.md", "README.md",
                                   "_quarto.yml", "activite.qmd", "styles.css"):
                          (check / name).write_bytes(
                              _git(repo, "show", f"{initial}:{name}"))
                      before = (check / ".gitignore").read_text()
                      proc = subprocess.run(
                          ["quarto", "render", "--to", "html", "--no-execute"],
                          cwd=check, capture_output=True, text=True, timeout=120)
                      after = (check / ".gitignore").read_text()
                      print("QUARTO_FIXTURE_DEBUG_RC=" + str(proc.returncode), flush=True)
                      print("QUARTO_FIXTURE_GITIGNORE_BEFORE=" + repr(before), flush=True)
                      print("QUARTO_FIXTURE_GITIGNORE_AFTER=" + repr(after), flush=True)
                      raise
              assert result["baseline_commit"] == initial
              assert result["observed_commit"] == observed
              # Inspect Quarto-generated, SHA-verified CSS in both versions.
              old_css = preview.get_asset(
                  preview.prefix + "/V1/project/_site/styles.css")[0]
              new_css = preview.get_asset(
                  preview.prefix + "/V2/project/_site/styles.css")[0]
              assert b"#2563eb" in old_css
              assert b"#15803d" in new_css
              url = urlsplit(preview.browser_url(server.server_port))
              thread = threading.Thread(target=server.serve_forever, daemon=True)
              thread.start()
              try:
                  conn = http.client.HTTPConnection(url.hostname, url.port, timeout=5)
                  try:
                      conn.request("GET", url.path + "?" + url.query)
                      response = conn.getresponse()
                      body = response.read()
                      assert response.status == 200
                      assert b"Consigne" in body
                  finally:
                      conn.close()
              finally:
                  server.shutdown()
                  server.server_close()
                  thread.join(timeout=5)
          print("PROPOSED_FIXED_DEMO_QUARTO_V5_V6=PASS; "
                "REMOTE_FIXTURE_BRANCH_UNMODIFIED=true; FIREFOX=UNPROVEN")
          PY
      - name: Preserve evidence boundary
        run: |
          echo "REAL_QUARTO_RENDER_AND_HTTP_CI=PASS_IF_PREVIOUS_STEPS_SUCCEEDED"
          echo "FIREFOX_NATIVE_SIDEBAR_AND_GITHUB_WRITE=UNPROVEN"
          echo "PUBLICATION_PERFORMED=false"
