name: "Pareto — Quarto réel, Git épinglé, HTTP et contexte Firefox"

on:
  pull_request:
    paths:
      - "quarto_pareto_demo.py"
      - "tests/test_quarto_pareto_demo.py"
      - "extension/historique_ressource.js"
      - "tests/test_historique_ressource.js"
      - ".github/workflows/quarto-pareto-vertical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vertical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render two real, synthetic Quarto Git revisions and serve verified HTML
        env:
          ALLIAGE_TEST_REAL_QUARTO: "1"
        run: |
          quarto --version
          python3 -m unittest discover -s tests -p 'test_quarto_pareto_demo.py' -v
      - name: Exercise Firefox overlay as DOM simulation only
        run: |
          node --check extension/historique_ressource.js
          node --test tests/test_historique_ressource.js
      - name: Verify the REAL public demo branch at its two pinned SHAs
        env:
          ALLIAGE_PINNED_DEMO_V1: "1b1c0f22e4f210bb24396274f56401ade0723353"
          ALLIAGE_PINNED_DEMO_V2: "4a3028334a63fdd722ffd4d3da7886558127d033"
        run: |
          git clone -q --single-branch --branch experiment/pareto-quarto-demo \
            https://github.com/djibian/alliage.git "$RUNNER_TEMP/alliage-public-demo"
          python3 - <<'PY'
          import http.client
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          from urllib.parse import urlsplit
          from quarto_pareto_demo import prepare
          from quarto_versions import _git
          repo = Path(os.environ["RUNNER_TEMP"]) / "alliage-public-demo"
          initial = os.environ["ALLIAGE_PINNED_DEMO_V1"]
          observed = os.environ["ALLIAGE_PINNED_DEMO_V2"]
          tracking = "refs/remotes/origin/experiment/pareto-quarto-demo"
          for sha in (initial, observed):
              assert _git(repo, "cat-file", "-t", sha).strip() == b"commit"
          # Re-pin the LOCAL clone's tracking ref to the reviewed V2 SHA.
          # Never rewrite the remote branch or any checkout.
          _git(repo, "update-ref", tracking, observed)
          with TemporaryDirectory(prefix="alliage-public-fixture-") as home:
              with patch("quarto_observed_session.Path.home", return_value=Path(home)):
                  try:
                      result, preview, server = prepare(
                          repo, "djibian/alliage", tracking, initial,
                          public_fictional_trusted=True)
                  except Exception:
                      # Diagnose ONLY PUBLIC/FICTIONAL tracked path names.
                      # Never loosen the Git snapshot integrity invariant.
                      from hashlib import sha256
                      import subprocess
                      src = Path(home) / "diagnostic-v1"
                      src.mkdir()
                      names = (".gitignore", "AGENTS.md", "README.md",
                               "_quarto.yml", "activite.qmd", "styles.css")
                      before = {}
                      for name in names:
                          data = _git(repo, "show", f"{initial}:{name}")
                          (src / name).write_bytes(data)
                          before[name] = sha256(data).hexdigest()
                      render = subprocess.run(
                          ["quarto", "render", "--to", "html", "--no-execute"],
                          cwd=src, capture_output=True, text=True, timeout=120)
                      changed = [name for name in names
                                 if sha256((src / name).read_bytes()).hexdigest() != before[name]]
                      print("PINNED_DEMO_DIAGNOSTIC_TRACKED_FILES_CHANGED=" +
                            ",".join(changed), flush=True)
                      print("PINNED_DEMO_DIAGNOSTIC_QUARTO_RC=" +
                            str(render.returncode), flush=True)
                      raise
                  try:
                      # For a reproducible pair, the tracking ref must point to V2.
                      assert result["baseline_commit"] == initial
                      assert result["observed_commit"] == observed, (
                          "Fixture branch moved; use a pinned local ref for this test")
                      url = urlsplit(preview.browser_url(server.server_port))
                      route = url.path + "?" + url.query
                      conn = http.client.HTTPConnection(url.hostname, url.port, timeout=5)
                      try:
                          # Server must be running to test HTTP. Running thread
                          # is strictly local; teardown precedes temp HOME removal.
                          import threading
                          thread = threading.Thread(target=server.serve_forever, daemon=True)
                          thread.start()
                          conn.request("GET", route)
                          response = conn.getresponse()
                          body = response.read()
                          assert response.status == 200
                          assert b"Consigne" in body
                      finally:
                          conn.close()
                          server.shutdown()
                          server.server_close()
                          thread.join(timeout=5)
                  finally:
                      pass
          print("REAL_PUBLIC_QUARTO_BRANCH_TWO_PINNED_COMMITS=PASS; FIREFOX=UNPROVEN")
          PY
      - name: Preserve evidence boundary
        run: |
          echo "REAL_QUARTO_RENDER_AND_HTTP_CI=PASS_IF_PREVIOUS_STEPS_SUCCEEDED"
          echo "FIREFOX_NATIVE_SIDEBAR_AND_GITHUB_WRITE=UNPROVEN"
          echo "PUBLICATION_PERFORMED=false"
