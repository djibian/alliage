name: "Pareto — Quarto réel, Git épinglé, HTTP et contexte Firefox"

on:
  pull_request:
    paths:
      - "quarto_pareto_demo.py"
      - "tests/test_quarto_pareto_demo.py"
      - "extension/historique_ressource.js"
      - "tests/test_historique_ressource.js"
      - ".github/workflows/quarto-pareto-vertical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vertical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render two real, synthetic Quarto Git revisions and serve verified HTML
        env:
          ALLIAGE_TEST_REAL_QUARTO: "1"
        run: |
          quarto --version
          python3 -m unittest discover -s tests -p 'test_quarto_pareto_demo.py' -v
      - name: Exercise Firefox overlay as DOM simulation only
        run: |
          node --check extension/historique_ressource.js
          node --test tests/test_historique_ressource.js
      - name: Verify the ADOPTED public demo ref with real Quarto at two pinned SHAs
        env:
          ALLIAGE_PINNED_DEMO_V5: "5b477ca0436cff5a4e5a3ec9b3b0bfbb8a514347"
          ALLIAGE_PINNED_DEMO_V6: "8e2f8b84515e9555c853c42f14cde0bca2c5de53"
          ALLIAGE_ADOPTED_DEMO_HEAD: "affdb099bafd94099bf219c174e1ec6bbf82968f"
        run: |
          # Test the actual remote fixture branch after reviewed PR #24 was merged.
          # Never invent a tracking ref or mutate it locally to simulate adoption.
          git clone -q --single-branch --branch experiment/pareto-quarto-demo \
            https://github.com/djibian/alliage.git "$RUNNER_TEMP/alliage-public-demo-adopted"
          python3 - <<'PY'
          import http.client
          import os
          import threading
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          from urllib.parse import urlsplit
          from quarto_pareto_demo import prepare
          from quarto_versions import _git

          repo = Path(os.environ["RUNNER_TEMP"]) / "alliage-public-demo-adopted"
          initial = os.environ["ALLIAGE_PINNED_DEMO_V5"]
          v6 = os.environ["ALLIAGE_PINNED_DEMO_V6"]
          observed = os.environ["ALLIAGE_ADOPTED_DEMO_HEAD"]
          tracking = "refs/remotes/origin/experiment/pareto-quarto-demo"
          for commit in (initial, v6, observed):
              assert _git(repo, "cat-file", "-t", commit).strip() == b"commit"
          assert _git(repo, "rev-parse", tracking + "^{commit}").decode().strip() == observed, (
              "Adopted remote fixture branch does not match pinned SHA"
          )
          assert _git(repo, "rev-parse", "HEAD").decode().strip() == observed
          # The merge preserves V5/V6 history and its final tree is exactly V6.
          assert _git(repo, "rev-parse", v6 + "^{tree}") == _git(
              repo, "rev-parse", observed + "^{tree}")
          assert _git(repo, "merge-base", "--is-ancestor", initial, observed) == b""
          with TemporaryDirectory(prefix="alliage-adopted-fixture-") as home:
              with patch("quarto_observed_session.Path.home", return_value=Path(home)):
                  result, preview, server = prepare(
                      repo, "djibian/alliage", tracking, initial,
                      public_fictional_trusted=True)
              assert result["baseline_commit"] == initial
              assert result["observed_commit"] == observed
              old_css = preview.get_asset(
                  preview.prefix + "/V1/project/_site/styles.css")[0]
              new_css = preview.get_asset(
                  preview.prefix + "/V2/project/_site/styles.css")[0]
              assert b"#2563eb" in old_css
              assert b"#15803d" in new_css
              url = urlsplit(preview.browser_url(server.server_port))
              thread = threading.Thread(target=server.serve_forever, daemon=True)
              thread.start()
              try:
                  conn = http.client.HTTPConnection(url.hostname, url.port, timeout=5)
                  try:
                      conn.request("GET", url.path + "?" + url.query)
                      response = conn.getresponse()
                      body = response.read()
                      assert response.status == 200
                      assert b"Consigne" in body
                  finally:
                      conn.close()
              finally:
                  server.shutdown()
                  server.server_close()
                  thread.join(timeout=5)
          print("ADOPTED_REMOTE_DEMO_QUARTO_V5_V6_TREE=PASS; "
                "REMOTE_REF_PINNED=true; FIREFOX=UNPROVEN")
          PY
      - name: Preserve evidence boundary
        run: |
          echo "REAL_QUARTO_RENDER_AND_HTTP_CI=PASS_IF_PREVIOUS_STEPS_SUCCEEDED"
          echo "FIREFOX_NATIVE_SIDEBAR_AND_GITHUB_WRITE=UNPROVEN"
          echo "PUBLICATION_PERFORMED=false"
